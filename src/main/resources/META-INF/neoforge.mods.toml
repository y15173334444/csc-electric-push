modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

    [[mods.dependencies]]
    modId = "minecraft"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "neoforge"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create_schematic_compute"
    # 兼容性按 API 自己的版本号判别（api 包 ApiVersion.CURRENT，与模组版本解耦）：本附属
    # 使用宿主套件面（API 0.2.0）并在 init 期守门；模组区间只表达最低发行线，不推断 API 兼容性。
    # Compatibility is indexed by the API's own version (api.ApiVersion.CURRENT, decoupled
    # from the mod version): the addon uses the host-suite surface (API 0.2.0) and gates in
    # init; the mod range only states the minimum release line, never API compatibility.
    versionRange = "${csc_version_range}"
    ordering = "AFTER"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create"
    versionRange = "${create_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "sable"
    # 下限 1.2.2（plot 网格改中心+本地坐标框架后才成形），上限卡 2.1。
    # Floor 1.2.2 (the plot grid only settled into its centre+local frame at 1.2.2);
    # the top is capped below 2.1.
    versionRange = "${sable_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true
