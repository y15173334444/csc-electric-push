modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

    [[mods.dependencies]]
    modId = "minecraft"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "neoforge"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create_schematic_compute"
    # 1.3.0 API 实验期（签名与语义可变）；冻结点 = API 版本 1.0.0（D9：API 版本独立于
    # 模组版本，首次破坏性变更即 1.0.0）。本区间上限卡在模组 1.4 只是发行节奏选择。
    # The API is experimental (signatures and semantics may change); the freeze point is
    # API version 1.0.0 (D9: the API version is independent of the mod version, the first
    # breaking change bumps it there). The cap below mod 1.4 is a release-cadence choice.
    # so the range stops below 1.4.
    versionRange = "${csc_version_range}"
    ordering = "AFTER"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create"
    versionRange = "${create_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "sable"
    # 下限 1.2.2（plot 网格改中心+本地坐标框架后才成形），上限卡 2.1。
    # Floor 1.2.2 (the plot grid only settled into its centre+local frame at 1.2.2);
    # the top is capped below 2.1.
    versionRange = "${sable_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true
