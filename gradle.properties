# 构建内存：NeoGradle userdev 首次生成 neoForm 需要较大堆
# Build heap: NeoGradle userdev's first neoForm generation needs room.
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = true

# ── Minecraft / NeoForge（与主仓 CSC 对齐）────────────────────────────
# Minecraft / NeoForge (aligned with the main CSC repo).
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1]
neo_version = 21.1.233
neo_version_range = [21.1.233,)
loader_version_range = [4,)

# ── 模组标识 ─────────────────────────────────────────────────────────
mod_id = csc_electric_push
mod_name = CSC: Electric Push
mod_license = MIT
mod_version = 0.1.0
mod_authors = StarryNight_Luo
mod_description = A Sable sub-level thruster whose push ratio is driven by a Create: Schematic Compute node graph.

# ── 依赖版本（接线形态与主仓一致）─────────────────────────────────────
# Dependency pins (same wiring shape as the main repo).
# CSC 本体按兄弟目录 build/libs 产物编译：先在主仓 ./gradlew jar
# The CSC jar comes from the sibling build/libs output: build the main repo first.
csc_version = 1.3.0
# 兼容性按 API 自己的版本号判别（api 包 `ApiVersion.CURRENT`，与模组版本解耦）：本附属
# 使用宿主套件面（API 0.2.0），init 期经 `ApiVersion.isAtLeast(0,2,0)` 守门；模组版本区间
# 只表达最低发行线 `[1.3.0,)`，不拿它推断 API 兼容性。
# Compatibility is indexed by the API's own version (api.ApiVersion.CURRENT, decoupled
# from the mod version): the addon uses the host-suite surface (API 0.2.0) and gates on
# ApiVersion.isAtLeast(0, 2, 0) in init; the mod range only states the minimum release
# line ([1.3.0,)) and never implies API compatibility.
csc_version_range = [1.3.0,)
create_maven_version = 6.0.10+mc1.21.1
create_version_range = [6.0.10,)
sable_version_range = [1.2.2,2.1)
